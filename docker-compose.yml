services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oushudhcheck-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MEDICINES_DB_PATH=/app/data/processed/medicines.db
    volumes:
      - ./data/processed:/app/data/processed:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: oushudhcheck-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - INTERNAL_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oushudhcheck-telegram-bot
    command: ["python", "bot/telegram_bot.py"]
    env_file:
      - .env
    environment:
      - MEDICINES_DB_PATH=/app/data/processed/medicines.db
    volumes:
      - ./data/processed:/app/data/processed:ro
    depends_on:
      - backend
    restart: unless-stopped
